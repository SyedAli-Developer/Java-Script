<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ha Generator & Copier</title>
    <style>
        /* CSS styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4.9;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h2 { color: #333; }

        #output-box {
            height: 300px;
            overflow-y: auto;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            background: #fafafa;
            white-space: pre-wrap; /* Lines ko sahi format me rakhne ke liye */
            font-size: 16px;
            line-height: 1.6;
        }

        .copy-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .copy-btn:hover {
            background-color: #218838;
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        /* Scrollbar styling */
        #output-box::-webkit-scrollbar {
            width: 8px;
        }
        #output-box::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>"Ha" Generator (1000 Times)</h2>
        
        <button class="copy-btn" onclick="copyText()">Copy All Content</button>

        <div id="output-box"></div>
    </div>

    <script>
        // JavaScript logic
        const outputBox = document.getElementById('output-box');
        let textToCopy = "";

        // Loop 1000 times aur content generate karein
        for (let i = 1; i <= 1000; i++) {
            textToCopy += i + ". Ha\n"; // \n naye line ke liye (copy ke waqt kaam ayega)
        }

        // HTML box mein content dikhane ke liye (\n ko <br> se badalna)
        outputBox.innerHTML = textToCopy.replace(/\n/g, "<br>");

        // Copy function
        function copyText() {
            // Navigator API se text copy karein
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("1000 lines copy ho gayi hain!");
            }).catch(err => {
                console.error('Copy karne mein masla hua: ', err);
            });
        }
    </script>

</body>
</html>
